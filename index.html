<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#28584d" />
    <meta name="description" content="犬の食事・点眼・排泄を記録し、家族で同期できるPWA" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>べぬケアごはん</title>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">食事・介護管理</p>
          <h1>べぬケアごはん</h1>
        </div>
        <span id="save-status" class="save-status" role="status">端末内に保存</span>
      </header>

      <main id="main" tabindex="-1">
        <section id="today-view" class="view" aria-labelledby="today-title"></section>
        <section id="eyedrops-view" class="view" aria-labelledby="eyedrops-title" hidden></section>
        <section id="history-view" class="view" aria-labelledby="history-title" hidden></section>
        <section id="settings-view" class="view" aria-labelledby="settings-title" hidden></section>
      </main>

      <nav class="bottom-nav" aria-label="メインメニュー">
        <button type="button" data-route="today" class="active" aria-current="page">
          <span aria-hidden="true">⌂</span><span>今日</span>
        </button>
        <button type="button" data-route="history">
          <span aria-hidden="true">▤</span><span>履歴</span>
        </button>
        <button type="button" data-route="eyedrops">
          <span aria-hidden="true">◉</span><span>点眼</span>
        </button>
        <button type="button" data-route="settings">
          <span aria-hidden="true">⚙</span><span>設定</span>
        </button>
      </nav>
    </div>

    <dialog id="action-dialog" class="sheet" aria-labelledby="dialog-title">
      <form method="dialog" id="action-form">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div id="dialog-content"></div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script>
      window.addEventListener("error", (event) => {
        const status = document.querySelector("#save-status");
        if (status) { status.textContent = `起動エラー: ${event.message}`; status.classList.add("error"); }
      });
      window.addEventListener("unhandledrejection", (event) => {
        const status = document.querySelector("#save-status");
        if (status) { status.textContent = `起動エラー: ${event.reason?.message || event.reason}`; status.classList.add("error"); }
      });
    </script>
    <script type="module">
      import("./js/app.js").catch((error) => {
        const status = document.querySelector("#save-status");
        status.textContent = `起動エラー: ${error.message}`;
        status.classList.add("error");
        console.error(error);
      });
    </script>
  </body>
</html>
