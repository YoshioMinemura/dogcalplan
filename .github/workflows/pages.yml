name: Deploy べぬケアごはん to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare public files
        run: |
          mkdir -p _site/icons _site/js
          cp index.html styles.css manifest.webmanifest sw.js _site/
          cp icons/icon.svg icons/icon-192.png icons/icon-512.png icons/icon-maskable.svg icons/apple-touch-icon.png _site/icons/
          cp js/app.js js/db.js js/defaults.js js/domain.js _site/js/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
